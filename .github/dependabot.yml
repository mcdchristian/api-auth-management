version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per ecosystem group rather than per package: NestJS packages move
    # in lockstep and updating them individually produces PRs that cannot pass
    # CI on their own.
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
          - 'eslint*'
      types:
        patterns:
          - '@types/*'
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
