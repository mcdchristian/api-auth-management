name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is what the Dockerfile ships; 22 is the current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # NODE_ENV=test keeps synchronize off, so the suite runs against the
      # schema the migrations produce. A migration that does not match the
      # entities fails here rather than in production.
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth_test
      JWT_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      # Keep hashing cheap; the work factor is not what these tests exercise.
      BCRYPT_ROUNDS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run migration:run

      - name: Run e2e tests
        run: npm run test:e2e
